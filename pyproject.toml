[project]
name = "zarin-intelligence"
version = "1.1.0"
description = "Zarbin (زرین‌بین) — ZarinPal Merchant Intelligence & Action Engine"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
zarin = "zarin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
connectors = [
    "google-analytics-data>=0.18",
    "google-auth>=2.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zarin"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
