name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — lint + tests (fixture data, no dataset needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest (metric-correctness + API, on deterministic fixtures)
        run: uv run pytest -q

  frontend:
    name: Frontend — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck + build (tsc --noEmit && vite build)
        run: npm run build
        working-directory: frontend
